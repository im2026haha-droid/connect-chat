<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect Chat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-screen" id="loginScreen">
        <div class="login-box">
            <h1>Connect</h1>
            <p>친구들과 실시간 채팅하세요!</p>
            <div class="login-form" id="loginForm">
                <input type="text" id="loginUsername" placeholder="이름" maxlength="12">
                <input type="password" id="loginPassword" placeholder="비밀번호">
                <button id="loginBtn">로그인</button>
                <div class="switch-form">계정이 없으신가요? <span id="showRegister">회원가입</span></div>
                <div class="error-message" id="loginError"></div>
            </div>
            <div class="login-form" id="registerForm" style="display:none;">
                <input type="text" id="regUsername" placeholder="이름 (2~12자)" maxlength="12">
                <input type="password" id="regPassword" placeholder="비밀번호 (4자 이상)">
                <div class="color-picker">
                    <span>프로필 색상:</span>
                    <div class="colors">
                        <div class="color-option selected" style="background:#FF6B6B;" data-color="#FF6B6B"></div>
                        <div class="color-option" style="background:#4ECDC4;" data-color="#4ECDC4"></div>
                        <div class="color-option" style="background:#95E1D3;" data-color="#95E1D3"></div>
                        <div class="color-option" style="background:#F38181;" data-color="#F38181"></div>
                        <div class="color-option" style="background:#6366f1;" data-color="#6366f1"></div>
                        <div class="color-option" style="background:#a855f7;" data-color="#a855f7"></div>
                        <div class="color-option" style="background:#ec4899;" data-color="#ec4899"></div>
                        <div class="color-option" style="background:#14b8a6;" data-color="#14b8a6"></div>
                    </div>
                </div>
                <button id="registerBtn">회원가입</button>
                <div class="switch-form">이미 계정이 있으신가요? <span id="showLogin">로그인</span></div>
                <div class="error-message" id="registerError"></div>
            </div>
        </div>
    </div>

    <div class="app-container" id="appContainer" style="display:none;">
        <aside class="sidebar">
            <div class="logo"><h2>Connect</h2></div>
            <div class="user-profile">
                <div class="avatar my-avatar" id="myAvatar">나</div>
                <div class="user-info">
                    <span class="username" id="myName">사용자</span>
                    <span class="status online">온라인</span>
                </div>
            </div>
            <nav class="chat-list">
                <div class="section-title">온라인 사용자</div>
                <ul id="onlineUsers"></ul>
            </nav>
            <div class="sidebar-footer">
                <button class="logout-btn" id="logoutBtn">로그아웃</button>
            </div>
        </aside>
        <main class="chat-main">
            <header class="chat-header">
                <button class="menu-btn" id="menuBtn">☰</button>
                <div class="header-info">
                    <h3>일반 채팅방</h3>
                    <span class="member-count" id="memberCount">0명 접속중</span>
                </div>
            </header>
            <div class="chat-messages" id="chatMessages"></div>
            <div class="typing-indicator" id="typingIndicator" style="display:none;">
                <span id="typingUser"></span> 입력 중
                <div class="typing-dots"><span></span><span></span><span></span></div>
            </div>
            <div class="chat-input-area">
                <div class="input-wrapper">
                    <input type="text" id="messageInput" placeholder="메시지를 입력하세요..." autocomplete="off">
                    <button class="emoji-btn" id="emojiBtn">😊</button>
                </div>
                <button class="send-btn" id="sendBtn">전송</button>
            </div>
        </main>
    </div>

    <div class="emoji-picker" id="emojiPicker">
        <div class="emoji-grid">
            <span class="emoji" data-emoji="😀">😀</span>
            <span class="emoji" data-emoji="😂">😂</span>
            <span class="emoji" data-emoji="😍">😍</span>
            <span class="emoji" data-emoji="🥰">🥰</span>
            <span class="emoji" data-emoji="😎">😎</span>
            <span class="emoji" data-emoji="🤔">🤔</span>
            <span class="emoji" data-emoji="😊">😊</span>
            <span class="emoji" data-emoji="👍">👍</span>
            <span class="emoji" data-emoji="❤️">❤️</span>
            <span class="emoji" data-emoji="🎉">🎉</span>
            <span class="emoji" data-emoji="🔥">🔥</span>
            <span class="emoji" data-emoji="💯">💯</span>
            <span class="emoji" data-emoji="👋">👋</span>
            <span class="emoji" data-emoji="🙏">🙏</span>
            <span class="emoji" data-emoji="✌️">✌️</span>
            <span class="emoji" data-emoji="💪">💪</span>
        </div>
    </div>

    <div class="call-modal" id="callModal" style="display:none;">
        <div class="call-container">
            <div class="call-info">
                <div class="call-avatar" id="callAvatar">?</div>
                <div class="call-name" id="callName">-</div>
                <div class="call-status" id="callStatus">통화 중...</div>
            </div>
            <video id="remoteVideo" autoplay playsinline class="remote-video"></video>
            <audio id="remoteAudio" autoplay></audio>
            <video id="localVideo" autoplay playsinline muted class="local-video"></video>
            <div class="call-controls">
                <button class="call-btn call-mute" id="callMute" title="마이크">🎤</button>
                <button class="call-btn call-video-toggle" id="callVideoToggle" title="카메라">📹</button>
                <button class="call-btn call-end" id="callEnd" title="통화 종료">📞</button>
            </div>
        </div>
    </div>

    <div class="incoming-call-modal" id="incomingCallModal" style="display:none;">
        <div class="incoming-call-box">
            <div class="incoming-call-avatar" id="incomingAvatar">?</div>
            <div class="incoming-call-name" id="incomingName">-</div>
            <div class="incoming-call-text">통화 요청</div>
            <div class="incoming-call-buttons">
                <button class="call-btn call-accept" id="callAccept">수락</button>
                <button class="call-btn call-reject" id="callReject">거절</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
